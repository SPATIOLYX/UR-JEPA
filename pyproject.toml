[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ur-jepa"
version = "0.1.0"
description = "Uniform-rectifiability regularizers for Joint-Embedding Predictive Architectures"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Triet M. Le", email = "tml@spatiolyx.ai"},
]
keywords = [
  "self-supervised-learning",
  "jepa",
  "representation-learning",
  "geometric-measure-theory",
  "uniform-rectifiability",
  "world-models",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "torch>=2.0",
  "numpy",
]

[project.optional-dependencies]
# Optional extras for the training / eval / viz scripts under scripts/.
# The core ur_jepa package only needs torch + numpy.
train = [
  "torchvision",
  "timm",
  "hydra-core",
  "tqdm",
  "wandb",
  "datasets<4.0",
  "huggingface-hub",
]
galaxy10 = [
  "h5py",
  "scikit-learn",
]
viz = [
  "matplotlib",
  "scipy",
]
all = [
  "ur-jepa[train,galaxy10,viz]",
]
dev = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/SPATIOLYX/UR-JEPA"
"Project page" = "https://spatiolyx.ai/research/ur-jepa"
"Bug Tracker" = "https://github.com/SPATIOLYX/UR-JEPA/issues"

[tool.hatch.build.targets.wheel]
packages = ["ur_jepa", "baselines"]
